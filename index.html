<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkVault — Smart Link &amp; Creator Organizer</title>
  <style>
    :root {
      --bg: #f5f6f4;
      --surface: #ffffff;
      --surface-subtle: #eef1ee;
      --text: #1e2624;
      --text-muted: #5b6864;
      --border: #dfe4e0;
      --accent: #3e6b68;
      --accent-hover: #325855;
      --accent-soft: #e6efee;
      --creator-accent: #4a6782;
      --creator-soft: #e8eef4;
      --danger: #9e4747;
    }

    [data-theme="dark"] {
      --bg: #141817;
      --surface: #1c2120;
      --surface-subtle: #242b29;
      --text: #e8ecea;
      --text-muted: #9aa6a2;
      --border: #2c3532;
      --accent: #639a95;
      --accent-hover: #74aba6;
      --accent-soft: #223533;
      --creator-accent: #7699b8;
      --creator-soft: #202d3a;
      --danger: #c96b6b;
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] {
        --bg: #141817;
        --surface: #1c2120;
        --surface-subtle: #242b29;
        --text: #e8ecea;
        --text-muted: #9aa6a2;
        --border: #2c3532;
        --accent: #639a95;
        --accent-hover: #74aba6;
        --accent-soft: #223533;
        --creator-accent: #7699b8;
        --creator-soft: #202d3a;
        --danger: #c96b6b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 28px 18px 64px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }

    .brand h1 {
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .theme-switch {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .theme-switch button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
    }

    .theme-switch button.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }

    .key-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .key-row label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .key-row input {
      flex: 1 1 240px;
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }

    .btn-secondary {
      background: var(--surface-subtle);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 1 1 320px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .input-row input:focus,
    .key-row input:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.86rem;
      color: var(--text-muted);
      min-height: 20px;
    }

    .status-msg.error {
      color: var(--danger);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .view-toggle {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .view-toggle button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: 7px;
      cursor: pointer;
    }

    .view-toggle button.active {
      background: var(--surface-subtle);
      color: var(--text);
      font-weight: 600;
    }

    .search-input {
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
      min-width: 210px;
      outline: none;
    }

    .group-section {
      margin-bottom: 24px;
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .group-title {
      font-size: 0.98rem;
      font-weight: 650;
    }

    .group-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 9px;
      border-radius: 999px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .link-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .link-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .link-card h3 {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .link-card h3 a {
      color: inherit;
      text-decoration: none;
    }

    .link-card h3 a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .btn-delete {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: var(--surface-subtle);
    }

    .link-card p.summary {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 9px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 0.78rem;
    }

    .pill {
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 500;
    }

    .pill-folder {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .pill-creator {
      background: var(--creator-soft);
      color: var(--creator-accent);
    }

    .pill-platform {
      background: var(--surface-subtle);
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 36px 20px;
      color: var(--text-muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>LinkVault</h1>
        <p>Saved on your own device · Auto-folders &amp; creator sorting · Free to host</p>
      </div>
      <div class="theme-switch" role="group" aria-label="Theme mode">
        <button type="button" data-theme-choice="system">Default</button>
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="dark">Dark</button>
      </div>
    </header>

    <section class="card">
      <div class="key-row">
        <label for="api-key-input">Free Gemini Key (optional):</label>
        <input
          type="password"
          id="api-key-input"
          placeholder="Paste free Google AI Studio key (AIza...) — stored only in your browser"
        />
        <button type="button" class="btn-secondary" id="save-key-btn">Save Key Locally</button>
      </div>

      <form class="input-row" id="analyze-form" onsubmit="return false;">
        <input
          type="url"
          id="url-input"
          placeholder="Paste a single YouTube, HackerRank, article, or Reel link..."
          required
        />
        <button type="submit" class="btn-primary" id="analyze-btn">Analyze &amp; Save</button>
      </form>
      <div class="status-msg" id="status-msg"></div>
    </section>

    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="Grouping view">
        <button type="button" id="view-folder" class="active">By Folder</button>
        <button type="button" id="view-creator">By Creator</button>
      </div>
      <input
        type="search"
        class="search-input"
        id="search-input"
        placeholder="Filter by title, creator, or folder..."
      />
    </div>

    <main id="library-container"></main>
  </div>

  <script>
    const THEME_KEY = "linkvault_theme_mode";
    const LINKS_KEY = "linkvault_device_links_v1";
    const API_KEY_STORAGE = "linkvault_user_gemini_key";

    let links = loadStoredLinks();
    let groupBy = "folder";

    function loadStoredLinks() {
      try {
        return JSON.parse(localStorage.getItem(LINKS_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveStoredLinks() {
      localStorage.setItem(LINKS_KEY, JSON.stringify(links));
    }

    function applyTheme(mode) {
      const valid = ["system", "light", "dark"].includes(mode) ? mode : "system";
      document.documentElement.setAttribute("data-theme", valid);
      localStorage.setItem(THEME_KEY, valid);
      document.querySelectorAll("[data-theme-choice]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.themeChoice === valid);
      });
    }

    document.querySelectorAll("[data-theme-choice]").forEach((btn) => {
      btn.addEventListener("click", () => applyTheme(btn.dataset.themeChoice));
    });
    applyTheme(localStorage.getItem(THEME_KEY) || "system");

    const apiKeyInput = document.getElementById("api-key-input");
    apiKeyInput.value = localStorage.getItem(API_KEY_STORAGE) || "";

    document.getElementById("save-key-btn").addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        localStorage.setItem(API_KEY_STORAGE, val);
        setStatus("Saved your Gemini API key locally in this browser.");
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
        setStatus("Cleared saved Gemini API key from this browser.");
      }
    });

    document.getElementById("view-folder").addEventListener("click", () => {
      groupBy = "folder";
      document.getElementById("view-folder").classList.add("active");
      document.getElementById("view-creator").classList.remove("active");
      renderLibrary();
    });

    document.getElementById("view-creator").addEventListener("click", () => {
      groupBy = "creator";
      document.getElementById("view-creator").classList.add("active");
      document.getElementById("view-folder").classList.remove("active");
      renderLibrary();
    });

    document.getElementById("search-input").addEventListener("input", renderLibrary);

    function setStatus(msg, isError = false) {
      const el = document.getElementById("status-msg");
      el.textContent = msg;
      el.className = isError ? "status-msg error" : "status-msg";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function extractYouTubeId(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtu.be")) return u.pathname.replace("/", "").split("/")[0] || null;
        if (u.hostname.includes("youtube.com")) {
          if (u.pathname.startsWith("/shorts/")) return u.pathname.split("/shorts/")[1].split("/")[0] || null;
          return u.searchParams.get("v");
        }
      } catch {}
      return null;
    }

    async function fetchBasicContext(url) {
      const ytId = extractYouTubeId(url);
      if (ytId) {
        try {
          const res = await fetch(
            `https://www.youtube.com/oembed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + ytId)}&format=json`
          );
          if (res.ok) {
            const data = await res.json();
            return {
              platform: "YouTube",
              rawTitle: data.title || "",
              creatorHint: data.author_name || "",
            };
          }
        } catch {}
        return { platform: "YouTube", rawTitle: "", creatorHint: "" };
      }

      const lower = url.toLowerCase();
      if (lower.includes("instagram.com")) return { platform: "Instagram", rawTitle: "", creatorHint: "" };
      if (lower.includes("hackerrank.com")) return { platform: "HackerRank", rawTitle: "", creatorHint: "HackerRank" };
      if (lower.includes("leetcode.com")) return { platform: "LeetCode", rawTitle: "", creatorHint: "LeetCode" };
      return { platform: "Web Link", rawTitle: "", creatorHint: "" };
    }

    function fallbackSmartMetadata(url, ctx, existingFolders) {
      const parsed = new URL(url);
      const slug = parsed.pathname.split("/").filter(Boolean).pop() || parsed.hostname;
      const readableSlug = decodeURIComponent(slug).replace(/[-_+]+/g, " ").trim();
      const smartTitle = ctx.rawTitle
        ? (ctx.creatorHint ? `${ctx.creatorHint}: ${ctx.rawTitle}` : ctx.rawTitle)
        : (readableSlug || parsed.hostname);

      const lower = `${url} ${smartTitle}`.toLowerCase();
      let folder = "General Links";
      if (lower.includes("sql")) folder = "SQL & Coding";
      else if (lower.includes("hackerrank") || lower.includes("leetcode") || lower.includes("code")) folder = "Coding Practice";
      else if (ctx.platform === "YouTube") folder = "YouTube Watchlist";
      else if (ctx.platform === "Instagram") folder = "Instagram Reels";

      const matchedFolder = existingFolders.find((f) => f.toLowerCase() === folder.toLowerCase());
      return {
        smart_title: smartTitle.slice(0, 90),
        folder_name: matchedFolder || folder,
        creator_name: ctx.creatorHint || parsed.hostname.replace(/^www\./, ""),
        summary: `Saved ${ctx.platform} link from ${parsed.hostname}. Add a free Gemini API key above for deeper AI naming.`,
        platform: ctx.platform,
      };
    }

    async function classifyLink(url) {
      const ctx = await fetchBasicContext(url);
      const existingFolders = Array.from(new Set(links.map((x) => x.folder_name).filter(Boolean)));
      const apiKey = (apiKeyInput.value || localStorage.getItem(API_KEY_STORAGE) || "").trim();

      if (!apiKey) {
        return fallbackSmartMetadata(url, ctx, existingFolders);
      }

      const prompt = `
Analyze this single link and return ONLY valid JSON with keys:
"smart_title", "folder_name", "creator_name", "summary".

URL: ${url}
Platform: ${ctx.platform}
Raw Title: ${ctx.rawTitle}
Creator Hint: ${ctx.creatorHint}
Existing folders: ${JSON.stringify(existingFolders)}

Rules:
1. smart_title: Clear, human-readable title of what this link is (e.g., "HackerRank SQL: Weather Observation Station 5" or "MrBeast: 100 Men vs 100 Women").
2. folder_name: Reuse an existing folder if it fits well; otherwise create a concise topic folder (2-3 words max).
3. creator_name: Creator, channel, platform, or author name.
4. summary: One short sentence describing what it is about.
`.trim();

      const endpoint =
        "https://generativelanguage.googleapis.com/v1beta/models/" +
        `gemini-3.5-flash-lite:generateContent?key=${encodeURIComponent(apiKey)}`;

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { responseMimeType: "application/json", temperature: 0.2 },
        }),
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || "Gemini API request failed.");
      }

      const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
      const parsed = JSON.parse(rawText);

      return {
        smart_title: String(parsed.smart_title || ctx.rawTitle || url).trim(),
        folder_name: String(parsed.folder_name || "General Links").trim(),
        creator_name: String(parsed.creator_name || ctx.creatorHint || "Unknown Creator").trim(),
        summary: String(parsed.summary || "Saved link.").trim(),
        platform: ctx.platform,
      };
    }

    function deleteLink(id) {
      links = links.filter((item) => item.id !== id);
      saveStoredLinks();
      renderLibrary();
    }

    function renderLibrary() {
      const container = document.getElementById("library-container");
      const query = document.getElementById("search-input").value.trim().toLowerCase();

      const filtered = links.filter((item) => {
        if (!query) return true;
        return (
          item.smart_title.toLowerCase().includes(query) ||
          item.folder_name.toLowerCase().includes(query) ||
          item.creator_name.toLowerCase().includes(query) ||
          item.summary.toLowerCase().includes(query)
        );
      });

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state">
            No saved links yet. Paste a link above—your items stay saved locally on your own device.
          </div>
        `;
        return;
      }

      const keyField = groupBy === "creator" ? "creator_name" : "folder_name";
      const groups = new Map();

      for (const item of filtered) {
        const key = item[keyField] || "Uncategorized";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }

      const sortedKeys = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b));

      container.innerHTML = sortedKeys
        .map((groupName) => {
          const items = groups.get(groupName);
          const cardsHtml = items
            .map(
              (item) => `
              <article class="link-card">
                <div class="link-top">
                  <h3><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.smart_title)}</a></h3>
                  <button type="button" class="btn-delete" onclick="deleteLink('${escapeHtml(item.id)}')" title="Remove from device">Remove</button>
                </div>
                <p class="summary">${escapeHtml(item.summary)}</p>
                <div class="meta-row">
                  <span class="pill pill-folder">Folder: ${escapeHtml(item.folder_name)}</span>
                  <span class="pill pill-creator">Creator: ${escapeHtml(item.creator_name)}</span>
                  <span class="pill pill-platform">${escapeHtml(item.platform)}</span>
                </div>
              </article>
            `
            )
            .join("");

          return `
            <section class="group-section">
              <div class="group-header">
                <h2 class="group-title">${escapeHtml(groupName)}</h2>
                <span class="group-count">${items.length} ${items.length === 1 ? "link" : "links"}</span>
              </div>
              <div class="cards">${cardsHtml}</div>
            </section>
          `;
        })
        .join("");
    }

    document.getElementById("analyze-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      e.stopPropagation();

      const input = document.getElementById("url-input");
      const btn = document.getElementById("analyze-btn");
      const url = input.value.trim();
      if (!url) return;

      const existing = links.find((x) => x.url === url);
      if (existing) {
        setStatus(`Already saved on your device in "${existing.folder_name}" (${existing.creator_name}).`);
        return;
      }

      btn.disabled = true;
      btn.textContent = "Analyzing...";
      setStatus("Analyzing link and organizing into a folder...");

      try {
        const meta = await classifyLink(url);
        const record = {
          id: String(Date.now()),
          url,
          ...meta,
        };
        links.unshift(record);
        saveStoredLinks();
        input.value = "";
        setStatus(`Saved "${record.smart_title}" under "${record.folder_name}" (${record.creator_name}).`);
        renderLibrary();
      } catch (err) {
        setStatus(err.message || "Could not analyze link.", true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Analyze & Save";
      }
    });

    renderLibrary();
  </script>
</body>
</html>
